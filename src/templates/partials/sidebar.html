{#- Latest news card. Pages that include the fragment (LOOP) wrap it in
    their own <aside class="sidebar">. -#}
{% set news_max = news_max | default(5) %}
<div class="sidebar-card">
  <div class="sidebar-label">Latest news</div>
  <ul class="sidebar-list">
    {% for news in data.news[:news_max] %}
      <li>
        <a href="{{ data.root }}news#{{ news.index }}">
          <span class="sidebar-date">{{ news.date }}</span>
          <span class="sidebar-title">{{ news.title }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
  <a class="sidebar-more" href="{{ data.root }}news">All news &rarr;</a>
</div>
