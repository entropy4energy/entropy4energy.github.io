name: Fusion Mirror code-only check
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'Makefile'
      - 'tests/**'
      - '.github/workflows/fusion-mirror-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements.txt -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check src/js/fusion-mirror.js
      - run: make -j2
      - run: python tests/test_fusion_mirror.py --dist dist --output /tmp/fusion-mirror-review
